{% extends 'base.html' %}

{% block conteudo %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-12 col-md-6 col-lg-4">

            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Login</h3>

                    <form id="form-login" action="{{url_for('login')}}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input id="input-email" type="text" class="form-control" name="form_email" placeholder="Digite seu email" >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Senha:</label>
                            <input id="input-senha" type="password" class="form-control" name="form_senha" placeholder="Digite sua senha" >
                        </div>

                        <button type="submit" class=" entrar btn btn-primary w-100  ">
                            Entrar
                        </button>

                        <a class="btn btn-danger w-100 " onclick="limpaInputsLogin()">
                            Cancelar
                        </a>
                    </form>
                    <h6>Não tem conta? </h6>
                    <a href="{{url_for('cadastro_funcionario')}}">Registre-se</a><br><br>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (opcional, mas recomendado) -->
<script src="/static/js/verificacoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

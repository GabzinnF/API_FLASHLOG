{% extends 'base.html' %}

{% block conteudo %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-12 col-md-6 col-lg-4">

            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Cadastro</h3>

                    <form id="form-cadastro" action="{{url_for('cadastro_funcionario')}}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome:</label>
                            <input type="text" class="form-control" name="form_nome" placeholder="Digite seu nome" required>
                        </div>
                        <div class="pai">
                            <div class="mb-3">
                                <label class="form-label">Data Nascimento:</label>
                                <input type="date" class="form-control" name="form_data" placeholder="Digite sua data de nascimento" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CPF:</label>
                                <input type="text" class="form-control" name="form_cpf" placeholder="Digite seu cpf" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" class="form-control" name="form_email" placeholder="Digite seu email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha:</label>
                            <input type="password" class="form-control" name="form_senha" placeholder="Digite sua senha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cargo:</label>
                            <input type="text" class="form-control" name="form_cargo" placeholder="Digite o cargo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Salário:</label>
                            <input type="text" class="form-control" name="form_salario" placeholder="Digite seu salário" required>
                        </div>

                        <button type="submit" class=" cadastro btn btn-primary w-100">
                            Cadastrar
                        </button>

                    </form>
                    <div class="botao_cadastro">
                        <a href="{{url_for('login')}}" class="botao_login btn btn-info" >Logar</a><br><br>
                        <a class="botao_sair btn btn-danger" onclick="limpaInputsLogin()">Cancelar</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (opcional, mas recomendado) -->
<script src="/static/js/verificacoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
